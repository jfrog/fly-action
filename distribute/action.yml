name: 'Fly Distribute'
description: 'Make a generic artifact version publicly downloadable. Requires jfrog/fly-action to have run first for authentication.'
author: 'JFrog'

inputs:
  name:
    description: 'Package name'
    required: true
  version:
    description: 'Package version'
    required: true
  type:
    description: 'Package type (default: generic)'
    required: false
    default: 'generic'

outputs:
  results:
    description: >
      JSON array with a single entry describing the distributed artifact:
      {package_name, package_version, package_type, public_url, download_url,
      download_count}. Emitted as an array to keep the output shape consistent
      with the upload/download sub-actions and so the post step can accumulate
      results across multiple distribute invocations in one job.

runs:
  # node24 for GitHub.com. GHES users: use jfrog/fly-action@v1-node20
  using: 'node24'
  main: '../lib/distribute.js'
