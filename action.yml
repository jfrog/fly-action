name: 'Setup Fly Registry'
description: 'Configures package managers to use Fly as a registry for dependencies'
author: 'Your Name'

inputs:
  url:
    description: 'Fly URL (optional — when omitted, tenant is resolved automatically from GitHub OIDC claims)'
    required: false
  ignore:
    description: 'Comma-separated list of package managers to ignore when configuring all (e.g., docker,pip)'
    required: false
  github_token:
    description: 'GitHub token for accessing workflow run information'
    required: false
    default: ${{ github.token }}

outputs:
  fly_url:
    description: 'The resolved Fly tenant URL (e.g., https://acmecorp.jfrog.io). Also exported as the FLY_URL environment variable for all subsequent steps.'

runs:
  using: 'node20'
  main: 'lib/index.js'
  post: 'lib/post.js'

branding:
  icon: 'package'
  color: 'blue'