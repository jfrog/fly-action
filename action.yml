name: 'JFrog Fly'
description: 'Seamlessly integrate JFrog Fly, the AI-native registry, into your build and release pipelines.'
author: 'JFrog'

inputs:
  ignore:
    description: 'Package managers to skip, as a comma-separated list (e.g., docker,pip,uv). By default, all detected package managers are configured.'
    required: false
  url:
    description: 'Your JFrog Fly URL. Optional — if omitted, it is detected automatically for you.'
    required: false

runs:
  using: 'node24'
  main: 'lib/index.js'
  post: 'lib/post.js'

branding:
  icon: 'package'
  color: 'green'
