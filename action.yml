name: 'Setup Fly Registry'
description: >
  Authenticates with Fly via GitHub OIDC and configures package managers.
  Downloads the Fly CLI automatically from releases.jfrog.io.
  After setup, the fly CLI is available on PATH and FLY_URL / FLY_ACCESS_TOKEN
  are exported for subsequent steps.
  Use jfrog/fly-action/upload and jfrog/fly-action/download sub-actions
  to transfer generic artifacts.
author: 'JFrog'

inputs:
  url:
    description: 'Fly URL (optional — when omitted, tenant is resolved automatically from GitHub OIDC claims)'
    required: false
  ignore:
    description: 'Comma-separated list of package managers to ignore when configuring all (e.g., docker,pip)'
    required: false
  distribute:
    description: 'Comma-separated list of generic artifacts to make publicly downloadable (e.g., "my-app:1.0.0,my-lib:2.3.1")'
    required: false
  distribute_type:
    description: 'Package type for distributed artifacts (default: generic)'
    required: false
    default: 'generic'

outputs:
  distribute_results:
    description: 'JSON array of distributed artifact results (package_name, package_version, public_url, download_url)'

runs:
  # node24 for GitHub.com. GHES users: use jfrog/fly-action@v1-node20
  # (auto-created by release workflow). See PRs #32, #36.
  using: 'node24'
  main: 'lib/index.js'
  post: 'lib/post.js'

branding:
  icon: 'package'
  color: 'blue'
