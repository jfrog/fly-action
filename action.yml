name: 'Setup Fly Registry'
description: >
  Authenticates with Fly via GitHub OIDC and configures package managers.
  Downloads the Fly CLI automatically from Fly public generic endpoint.
  After setup, the fly CLI is available on PATH and FLY_URL / FLY_ACCESS_TOKEN
  are exported for subsequent steps.
  Use jfrog/fly-action/upload, jfrog/fly-action/download, and
  jfrog/fly-action/distribute sub-actions for generic artifacts.
author: 'JFrog'

inputs:
  url:
    description: 'Fly URL (optional — when omitted, tenant is resolved automatically from GitHub OIDC claims)'
    required: false
  ignore:
    description: 'Comma-separated list of package managers to ignore when configuring all (e.g., docker,pip,uv)'
    required: false

runs:
  # node24 for GitHub.com. GHES users: use jfrog/fly-action@v1-node20
  # (auto-created by release workflow). See PRs #32, #36.
  using: 'node24'
  main: 'lib/index.js'
  post: 'lib/post.js'

branding:
  icon: 'package'
  color: 'blue'
