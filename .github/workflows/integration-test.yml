name: "Integration Tests"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  integration-tests:
    strategy:
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup JFrog Fly
        uses: ./
        with:
          url: https://flyjfrog.jfrog.io

      - name: Verify FLY_REGISTRY_SUBDOMAIN is exported
        run: |
          echo "FLY_REGISTRY_SUBDOMAIN=${{ env.FLY_REGISTRY_SUBDOMAIN }}"
          if [ -z "$FLY_REGISTRY_SUBDOMAIN" ]; then
            echo "::error::FLY_REGISTRY_SUBDOMAIN is not set"
            exit 1
          fi

      - name: Install dependencies
        run: npm i

      - name: Run fly-client integration tests
        run: npx jest src/integration-tests/
