name: "Unit Tests"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup JFrog Fly
        uses: jfrog/fly-action@v1
        with:
          url: https://flyjfrog.jfrog.io

      - name: Install dependencies
        run: npm i

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --testPathIgnorePatterns=integration-tests --testPathIgnorePatterns=dist --testPathIgnorePatterns=lib

      - name: Build
        run: npm run build

      # The GitHub Action runs from lib/ (compiled files), not src/.
      # If lib/ is not rebuilt after src/ changes, the action will run stale code.
      - name: Verify lib/ is compiled and up to date
        run: |
          if [[ -n "$(git status lib/ --porcelain)" ]]; then
            echo "::error::lib/ is out of sync with src/. Run 'npm run build' and commit the changes."
            git diff lib/ --stat
            exit 1
          fi
