name: "Unit Tests"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm i

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --testPathIgnorePatterns=integration-tests

      - name: Build
        run: npm run build
