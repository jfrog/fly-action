name: 'Fly Upload'
description: 'Upload files to Fly generic storage. Requires jfrog/fly-action to have run first for authentication.'
author: 'JFrog'

inputs:
  name:
    description: 'Artifact name'
    required: true
  version:
    description: 'Artifact version. Required — pass a concrete version like "1.0.0" or "nightly-2025-03-26". The reserved token "[LATEST]" is download-only and is rejected on upload.'
    required: true
  files:
    description: 'Files to upload -- one per line. Supports glob patterns (*, ?, [], **). Basename is used as remote filename.'
    required: true
  exclude:
    description: 'Glob patterns to exclude -- one per line (e.g. *.log). Matched against basename only.'
    required: false

outputs:
  results:
    description: 'JSON array of per-file results [{name, status, message}]'

runs:
  # node24 for GitHub.com. GHES users: use jfrog/fly-action@v1-node20
  using: 'node24'
  main: '../lib/upload.js'
