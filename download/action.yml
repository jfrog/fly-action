name: 'Fly Download'
description: 'Download files from Fly generic storage. Requires jfrog/fly-action to have run first for authentication.'
author: 'JFrog'

inputs:
  name:
    description: 'Artifact name'
    required: true
  version:
    description: 'Artifact version. Optional — when omitted, defaults to "[LATEST]" (case-insensitive: also "[latest]", "[Latest]"). [LATEST] is supported ONLY for artifacts that have been publicly distributed via jfrog/fly-action/distribute@v1; in that case the action downloads anonymously from the public endpoint, which 302-redirects to the newest concrete version. For private/authenticated downloads, you MUST pass a concrete version (e.g. "1.0.0") — the authenticated endpoint is a JPD passthrough and does not resolve [LATEST].'
    required: false
  files:
    description: 'Remote filenames to download -- one per line (exact names, no glob expansion)'
    required: true
  output-dir:
    description: 'Directory to save downloaded files'
    required: false
    default: '.'
  exclude:
    description: 'Glob patterns to exclude -- one per line. Matched against filename only.'
    required: false

outputs:
  results:
    description: 'JSON array of per-file results [{name, status, message}]'

runs:
  # node24 for GitHub.com. GHES users: use jfrog/fly-action@v1-node20
  using: 'node24'
  main: '../lib/download.js'
