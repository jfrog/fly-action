name: 'Fly Go Publish'
description: 'Publish a Go module to Fly. Requires jfrog/fly-action to have run first for authentication.'
author: 'JFrog'

inputs:
  path:
    description: 'Path to the module directory containing go.mod (defaults to repository root)'
    required: false
    default: '.'
  version:
    description: 'Module version to publish (auto-detected from git tags if omitted)'
    required: false

outputs:
  results:
    description: 'JSON array of per-module results [{name, status, message}]'

runs:
  # node24 for GitHub.com. GHES users: use jfrog/fly-action@v1-node20
  using: 'node20'
  main: '../lib/go-publish.js'
